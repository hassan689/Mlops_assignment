services:
  - type: web
    name: visionguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visionguard-db
          property: connectionString
      - key: MODEL_THRESHOLD
        value: "0.5"
      - key: API_KEY
        generateValue: true
      - key: MODEL_PATH
        value: /app/model
databases:
  - name: visionguard-db
    databaseName: visionguard
    user: visionguard
