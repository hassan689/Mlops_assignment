<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>VisionGuard</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<nav><a href="{{ url_for('upload') }}">Upload</a><a href="{{ url_for('history') }}">History</a><a href="{{ url_for('health') }}">Health</a></nav>
<main class="card">
<h1>VisionGuard</h1><p>Upload an image to receive a model estimate.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form action="{{ url_for('predict') }}" method="post" enctype="multipart/form-data">
  <label for="image">Image file</label><input id="image" name="image" type="file" accept="image/*" required>
  <button type="submit">Analyze image</button>
</form>
<p class="caveat">The result is an estimate and may be wrong.</p>
</main>
</body>
</html>
